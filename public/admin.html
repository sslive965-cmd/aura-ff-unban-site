<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA • Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #35104f, #09070d 55%);
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: rgba(20, 15, 28, .94);
      border: 1px solid #49345d;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .muted {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #514060;
      background: #110d17;
      color: white;
      font-size: 15px;
    }

    button {
      background: #6d35d8;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #3a293f;
      margin-top: 15px;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
      background: #24182c;
      color: #ddd;
      font-size: 14px;
    }

    .request {
      border: 1px solid #49345d;
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
      background: #120d18;
    }

    .request p {
      margin: 7px 0;
      line-height: 1.4;
      word-break: break-word;
    }

    .label {
      color: #a989d8;
      font-weight: bold;
    }

    .status {
      padding: 8px;
      margin-top: 10px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .topbar button {
      width: auto;
      padding: 10px 18px;
      margin: 0;
    }

    #dashboard {
      display: none;
    }

    #loginCard {
      max-width: 430px;
      margin: 70px auto;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h1>AURA • Admin</h1>
    <p class="muted">
      Secure administrator login.
    </p>

    <input
      id="username"
      type="text"
      placeholder="Admin username"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <button onclick="login()">LOGIN</button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="card">
      <div class="topbar">
        <div>
          <h1>AURA • Admin Dashboard</h1>
          <p class="muted">
            Support request management
          </p>
        </div>

        <button class="logout" onclick="logout()">
          LOGOUT
        </button>
      </div>
    </div>


    <div class="card">
      <div class="topbar">
        <div>
          <h2>Support Requests</h2>
          <p class="muted">
            Requests submitted from the public website.
          </p>
        </div>

        <button onclick="loadRequests()">
          REFRESH
        </button>
      </div>

      <div id="requests">
        <div class="empty">
          Loading requests...
        </div>
      </div>
    </div>

  </div>

</div>


<script>

async function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.style.display = "block";
  message.textContent = "Checking login...";

  try {

    const response = await fetch("/admin/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username,
        password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      message.textContent =
        data.error || "Login failed.";
      return;
    }

    document.getElementById("loginCard")
      .style.display = "none";

    document.getElementById("dashboard")
      .style.display = "block";

    await loadRequests();

  } catch (error) {

    message.textContent =
      "Connection error. Please try again.";
  }
}


async function checkSession() {

  try {

    const response =
      await fetch("/admin/api/me");

    if (response.ok) {

      document.getElementById("loginCard")
        .style.display = "none";

      document.getElementById("dashboard")
        .style.display = "block";

      await loadRequests();
    }

  } catch (error) {
    console.log("Session check failed.");
  }
}


async function logout() {

  try {
    await fetch("/admin/logout", {
      method: "POST"
    });
  } catch (error) {}

  document.getElementById("dashboard")
    .style.display = "none";

  document.getElementById("loginCard")
    .style.display = "block";

  document.getElementById("password").value = "";
}


async function loadRequests() {

  const box =
    document.getElementById("requests");

  box.innerHTML =
    '<div class="empty">Loading requests...</div>';

  try {

    const response =
      await fetch("/admin/api/requests");

    const data =
      await response.json();

    if (!response.ok) {

      box.innerHTML =
        `<div class="empty">${escapeHtml(
          data.error || "Could not load requests."
        )}</div>`;

      return;
    }

    const requests =
      data.requests || [];

    if (!requests.length) {

      box.innerHTML =
        '<div class="empty">No support requests yet.</div>';

      return;
    }

    box.innerHTML =
      requests.map(renderRequest).join("");

  } catch (error) {

    box.innerHTML =
      '<div class="empty">Could not connect to server.</div>';
  }
}


function renderRequest(item) {

  const date =
    item.created_at
      ? new Date(item.created_at).toLocaleString()
      : "Unknown";

  return `
    <div class="request">

      <p>
        <span class="label">Request ID:</span>
        ${escapeHtml(String(item.id))}
      </p>

      <p>
        <span class="label">UID:</span>
        ${escapeHtml(item.uid || "")}
      </p>

      <p>
        <span class="label">Region:</span>
        ${escapeHtml(item.region || "")}
      </p>

      <p>
        <span class="label">Issue:</span><br>
        ${escapeHtml(item.issue || "")}
      </p>

      <p>
        <span class="label">Contact:</span>
        ${escapeHtml(item.contact || "Not provided")}
      </p>

      <p>
        <span class="label">Created:</span>
        ${escapeHtml(date)}
      </p>

      <p>
        <span class="label">Status:</span>
      </p>

      <select
        class="status"
        onchange="updateStatus(${Number(item.id)}, this.value)"
      >
        ${statusOption("pending", item.status)}
        ${statusOption("reviewing", item.status)}
        ${statusOption("resolved", item.status)}
        ${statusOption("rejected", item.status)}
      </select>

    </div>
  `;
}


function statusOption(value, current) {

  const selected =
    value === current ? "selected" : "";

  return `
    <option value="${value}" ${selected}>
      ${value.toUpperCase()}
    </option>
  `;
}


async function updateStatus(id, status) {

  try {

    const response =
      await fetch(
        `/admin/api/requests/${encodeURIComponent(id)}`,
        {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            status
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "Could not update request."
      );

      await loadRequests();
      return;
    }

  } catch (error) {

    alert(
      "Connection error while updating request."
    );

    await loadRequests();
  }
}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


checkSession();

</script>

</body>
</html>
